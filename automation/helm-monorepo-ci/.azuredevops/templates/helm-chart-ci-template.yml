parameters:
  - name: chartName
    type: string

  - name: chartPath
    type: string

  - name: kubernetesVersion
    type: string
    default: '1.35.0'

stages:
  - stage: HelmCI
    displayName: Helm CI

    jobs:
      - job: ValidateHelmChart
        displayName: Validate ${{ parameters.chartName }}

        pool:
          vmImage: ubuntu-latest

        steps:
          - checkout: self
            clean: true
            fetchDepth: 0

          - pwsh: |
              ./scripts/helm/Install-HelmTools.ps1
            displayName: Install Helm CI tools

          - pwsh: |
              ./scripts/helm/Test-HelmChart.ps1 `
                -ChartName '${{ parameters.chartName }}' `
                -ChartPath '${{ parameters.chartPath }}' `
                -KubernetesVersion '${{ parameters.kubernetesVersion }}' `
                -OutputDirectory '$(Build.ArtifactStagingDirectory)'
            displayName: Validate Helm chart

          - task: PublishTestResults@2
            displayName: Publish Helm unit tests
            condition: always()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: |
                $(Build.ArtifactStagingDirectory)/tests/*.xml
              testRunTitle: Helm - ${{ parameters.chartName }}
              failTaskOnFailedTests: true

          - task: PublishPipelineArtifact@1
            displayName: Publish Helm package
            inputs:
              targetPath: $(Build.ArtifactStagingDirectory)/packages
              artifact: helm-${{ parameters.chartName }}
